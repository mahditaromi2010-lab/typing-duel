<svg viewBox="0 0 900 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1430"/>
      <stop offset="0.45" stop-color="#3a2347"/>
      <stop offset="0.72" stop-color="#8a3d4a"/>
      <stop offset="1" stop-color="#d9713f"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd9a0" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#ff8a5c" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff8a5c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140c20" stop-opacity="0"/>
      <stop offset="1" stop-color="#0a0612" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="900" height="450" fill="url(#sky)"/>
  <circle cx="450" cy="300" r="220" fill="url(#sun)"/>

  <!-- far mountain range -->
  <path d="M0,300 L60,250 L130,290 L210,230 L300,280 L380,240 L460,285 L540,235 L630,280 L710,245 L800,290 L900,250 L900,450 L0,450 Z"
    fill="#2a1830" opacity="0.85"/>

  <!-- mid mountain range, darker, closer -->
  <path d="M0,340 L90,300 L170,335 L260,285 L350,330 L440,295 L520,335 L610,290 L700,330 L790,300 L900,335 L900,450 L0,450 Z"
    fill="#1a0f1f"/>

  <!-- distant pagoda towers silhouette -->
  <g fill="#160c1b">
    <path d="M150,340 L150,300 L140,300 L160,284 L180,300 L170,300 L170,340 Z"/>
    <path d="M140,284 L180,284 L170,274 L150,274 Z"/>
    <path d="M620,345 L620,295 L608,295 L630,276 L652,295 L640,295 L640,345 Z"/>
    <path d="M608,295 L652,295 L640,283 L620,283 Z"/>
    <path d="M740,352 L740,312 L732,312 L748,298 L764,312 L756,312 L756,352 Z"/>
  </g>

  <!-- ground / haze fade so the fighters read clearly in front -->
  <rect x="0" y="330" width="900" height="120" fill="url(#haze)"/>
</svg>
